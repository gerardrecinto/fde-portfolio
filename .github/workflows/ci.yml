name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  demo-and-site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23", cache: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Run the customer demo
        run: bash demo/run.sh | tee demo/output.txt
      - name: Build the site
        run: python3 scripts/build_site.py demo/output.txt
      - name: Check links
        run: python3 scripts/check_links.py
